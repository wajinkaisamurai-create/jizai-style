<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>福田ひろし ボイスサンプル</title>
  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: sans-serif;
      line-height: 1.8;
    }
    section {
      margin: 32px 0;
      padding-bottom: 24px;
      border-bottom: 1px solid #ddd;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>福田ひろし ボイスサンプル</h1>
  <p>落ち着きと信頼感のある男性ナレーション。企業、教材、和文化、朗読、CM、キャラクターボイスに対応します。</p>

  <section>
    <h2>自己紹介</h2>
    <audio controls preload="metadata">
      <source src="audio/pr.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>企業ナレーション</h2>
    <audio controls preload="metadata">
      <source src="audio/corporate.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>eラーニング</h2>
    <audio controls preload="metadata">
      <source src="audio/elearning.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>観光・和文化</h2>
    <audio controls preload="metadata">
      <source src="audio/japanese-culture.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>キャラクターボイス</h2>
    <audio controls preload="metadata">
      <source src="audio/storyteller.mp3" type="audio/mpeg">
    </audio>
  </section>
</body>
</html>
